apiVersion: 1

datasources:
  - name: Workspace Logs
    uid: workspace-logs
    type: loki
    access: proxy
    url: http://loki:3100
    isDefault: true
    jsonData:
      derivedFields:
        - name: Trace
          matcherType: label
          matcherRegex: "^trace_id$"
          datasourceUid: workspace-traces
          url: '$${__value.raw}'
  - name: Workspace Traces
    uid: workspace-traces
    type: jaeger
    access: proxy
    url: http://jaeger:16686
    jsonData:
      tracesToLogsV2:
        datasourceUid: workspace-logs
        spanStartTimeShift: "-1m"
        spanEndTimeShift: "1m"
        customQuery: true
        query: '{service_name=~"workspace-.+"} | trace_id="$${__span.traceId}"'
