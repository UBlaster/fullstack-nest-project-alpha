services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app}
      POSTGRES_DB: ${POSTGRES_DB:-workspace_docs}
    ports: ["5432:5432"]
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck: {test: ["CMD-SHELL","pg_isready -U app -d workspace_docs"], interval: 5s, timeout: 5s, retries: 10}
  db-init:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    command: ["sh", "-c", "npx prisma migrate deploy && npx prisma db seed"]
    environment: {DATABASE_URL: "postgresql://app:app@postgres:5432/workspace_docs?schema=public"}
    depends_on: {postgres: {condition: service_healthy}}
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    environment:
      DATABASE_URL: "postgresql://app:app@postgres:5432/workspace_docs?schema=public"
      JWT_SECRET: "${JWT_SECRET:-dev-secret}"
      JWT_EXPIRES_IN: "1d"
      PORT: "3000"
      CORS_ORIGIN: "http://localhost:5173"
      TSC_WATCHFILE: "DynamicPriorityPolling"
      TSC_WATCHDIRECTORY: "DynamicPriorityPolling"
    ports: ["3000:3000"]
    volumes:
      - ./backend/src:/app/src
      - ./backend/prisma:/app/prisma
      - ./backend/test:/app/test
      - ./backend/tsconfig.json:/app/tsconfig.json
      - ./backend/nest-cli.json:/app/nest-cli.json
    command: ["sh", "-c", "npx prisma generate && npm run start:dev"]
    depends_on: {db-init: {condition: service_completed_successfully}}
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    environment: {VITE_API_URL: http://localhost:3000}
    ports: ["5173:5173"]
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/index.html:/app/index.html
      - ./frontend/tsconfig.json:/app/tsconfig.json
      - ./frontend/vite.config.ts:/app/vite.config.ts
    command: npm run dev -- --host 0.0.0.0
    depends_on: [backend]
  workspace:
    build:
      context: ./.devcontainer
      dockerfile: Dockerfile
    working_dir: /workspace
    volumes:
      - ./:/workspace
    command:
      [
        "sh",
        "-c",
        "node /workspace/.devcontainer/forward-ports.js & exec sleep infinity",
      ]
    depends_on: [backend, frontend]
volumes:
  postgres-data: {}
