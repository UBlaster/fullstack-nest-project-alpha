services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app}
      POSTGRES_DB: ${POSTGRES_DB:-workspace_docs}
    ports: ["${POSTGRES_HOST_PORT:-5432}:5432"]
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      {
        test: ["CMD-SHELL", "pg_isready -U app -d workspace_docs"],
        interval: 5s,
        timeout: 5s,
        retries: 10,
      }
  redis:
    image: redis:7-bookworm
    command:
      [
        "redis-server",
        "--appendonly",
        "yes",
        "--maxmemory-policy",
        "noeviction",
      ]
    volumes: [redis-data:/data]
    healthcheck:
      {
        test: ["CMD", "redis-cli", "ping"],
        interval: 5s,
        timeout: 3s,
        retries: 10,
      }
  db-init:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    command: ["sh", "-c", "npx prisma migrate deploy && npx prisma db seed"]
    environment:
      DATABASE_URL: "postgresql://app:app@postgres:5432/workspace_docs?schema=public"
      BCRYPT_ROUNDS: "${BCRYPT_ROUNDS:-12}"
    depends_on: { postgres: { condition: service_healthy } }
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    environment:
      DATABASE_URL: "postgresql://app:app@postgres:5432/workspace_docs?schema=public"
      JWT_SECRET: "${JWT_SECRET:-dev-secret}"
      JWT_EXPIRES_IN: "1d"
      BCRYPT_ROUNDS: "${BCRYPT_ROUNDS:-12}"
      PORT: "3000"
      CORS_ORIGIN: "http://localhost:5173"
      REDIS_URL: "${REDIS_URL:-redis://redis:6379}"
      CACHE_ENABLED: "${CACHE_ENABLED:-true}"
      CACHE_PROJECTS_TTL_SECONDS: "${CACHE_PROJECTS_TTL_SECONDS:-60}"
      CACHE_SEARCH_TTL_SECONDS: "${CACHE_SEARCH_TTL_SECONDS:-30}"
      CACHE_LOCK_TTL_MS: "${CACHE_LOCK_TTL_MS:-5000}"
      S3_ENDPOINT: "${S3_ENDPOINT:-https://storage.yandexcloud.net}"
      S3_REGION: "${S3_REGION:-ru-central1}"
      S3_BUCKET: "${S3_BUCKET:-tt5}"
      S3_ACCESS_KEY_ID: "${S3_ACCESS_KEY_ID}"
      S3_SECRET_ACCESS_KEY: "${S3_SECRET_ACCESS_KEY}"
      S3_FORCE_PATH_STYLE: "${S3_FORCE_PATH_STYLE:-false}"
      S3_UPLOAD_TTL_SECONDS: "${S3_UPLOAD_TTL_SECONDS:-600}"
      S3_DOWNLOAD_TTL_SECONDS: "${S3_DOWNLOAD_TTL_SECONDS:-300}"
      DOCUMENT_FILE_MAX_BYTES: "${DOCUMENT_FILE_MAX_BYTES:-26214400}"
      DOCUMENT_FILE_PENDING_TTL_HOURS: "${DOCUMENT_FILE_PENDING_TTL_HOURS:-24}"
      EXPORT_QUEUE_NAME: "${EXPORT_QUEUE_NAME:-workspace-exports}"
      EXPORT_DLQ_NAME: "${EXPORT_DLQ_NAME:-workspace-exports-dead}"
      EXPORT_OUTBOX_POLL_MS: "${EXPORT_OUTBOX_POLL_MS:-1000}"
      EXPORT_OUTBOX_LEASE_MS: "${EXPORT_OUTBOX_LEASE_MS:-30000}"
      EXPORT_HEARTBEAT_THROTTLE_MS: "${EXPORT_HEARTBEAT_THROTTLE_MS:-2000}"
      EXPORT_STALE_AFTER_MS: "${EXPORT_STALE_AFTER_MS:-300000}"
      EXPORT_RETENTION_MS: "${EXPORT_RETENTION_MS:-86400000}"
      TSC_WATCHFILE: "DynamicPriorityPolling"
      TSC_WATCHDIRECTORY: "DynamicPriorityPolling"
    ports: ["3000:3000"]
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3000/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 3s
      retries: 10
    volumes:
      - ./backend/src:/app/src
      - ./backend/prisma:/app/prisma
      - ./backend/test:/app/test
      - ./backend/tsconfig.json:/app/tsconfig.json
      - ./backend/nest-cli.json:/app/nest-cli.json
    command: ["sh", "-c", "npx prisma generate && npm run start:dev"]
    depends_on: { db-init: { condition: service_completed_successfully } }
  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    environment:
      DATABASE_URL: "postgresql://app:app@postgres:5432/workspace_docs?schema=public"
      REDIS_URL: "${REDIS_URL:-redis://redis:6379}"
      S3_ENDPOINT: "${S3_ENDPOINT:-https://storage.yandexcloud.net}"
      S3_REGION: "${S3_REGION:-ru-central1}"
      S3_BUCKET: "${S3_BUCKET:-tt5}"
      S3_ACCESS_KEY_ID: "${S3_ACCESS_KEY_ID}"
      S3_SECRET_ACCESS_KEY: "${S3_SECRET_ACCESS_KEY}"
      S3_FORCE_PATH_STYLE: "${S3_FORCE_PATH_STYLE:-false}"
      S3_UPLOAD_TTL_SECONDS: "${S3_UPLOAD_TTL_SECONDS:-600}"
      S3_DOWNLOAD_TTL_SECONDS: "${S3_DOWNLOAD_TTL_SECONDS:-300}"
      EXPORT_QUEUE_NAME: "${EXPORT_QUEUE_NAME:-workspace-exports}"
      EXPORT_DLQ_NAME: "${EXPORT_DLQ_NAME:-workspace-exports-dead}"
      EXPORT_HEARTBEAT_THROTTLE_MS: "${EXPORT_HEARTBEAT_THROTTLE_MS:-2000}"
      EXPORT_STALE_AFTER_MS: "${EXPORT_STALE_AFTER_MS:-300000}"
      EXPORT_RETENTION_MS: "${EXPORT_RETENTION_MS:-86400000}"
      TSC_WATCHFILE: "DynamicPriorityPolling"
      TSC_WATCHDIRECTORY: "DynamicPriorityPolling"
    volumes:
      - ./backend/src:/app/src
      - ./backend/prisma:/app/prisma
      - ./backend/tsconfig.json:/app/tsconfig.json
      - ./backend/nest-cli.json:/app/nest-cli.json
    command:
      [
        "sh",
        "-c",
        "npx prisma generate && exec ./node_modules/.bin/ts-node src/worker.ts",
      ]
    healthcheck:
      test: ["CMD", "node", "-e", "process.kill(1, 0)"]
      interval: 10s
      timeout: 3s
      retries: 5
    depends_on:
      db-init: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    environment: { VITE_API_URL: http://localhost:3000 }
    ports: ["5173:5173"]
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/index.html:/app/index.html
      - ./frontend/tsconfig.json:/app/tsconfig.json
      - ./frontend/vite.config.ts:/app/vite.config.ts
    command: npm run dev -- --host 0.0.0.0
    depends_on: [backend]
  workspace:
    build:
      context: ./.devcontainer
      dockerfile: Dockerfile
    working_dir: /workspace
    volumes:
      - ./:/workspace
    command:
      [
        "sh",
        "-c",
        "node /workspace/.devcontainer/forward-ports.js & exec sleep infinity",
      ]
    depends_on: [backend, worker, frontend]
volumes:
  postgres-data: {}
  redis-data: {}
